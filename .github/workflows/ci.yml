name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: make install

      - name: Run tests
        run: make test

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: make install

      - name: Run linter
        run: make lint

  # Legacy best-effort job for old-school users still on Python 2.7.
  # actions/setup-python no longer ships Python 2.7 builds for current
  # Ubuntu runners, so this runs the test suite inside the archived
  # python:2.7 Docker image instead. Checkout happens on the host
  # runner (old images lack the Node runtime checkout needs), then the
  # workspace is mounted into the container for install + test.
  legacy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run tests on Python 2.7
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e MPLBACKEND=Agg \
            python:2.7-slim \
            bash -c "pip install -r requirements.txt && pip install . && pytest --cov=roipoly --cov-branch --cov-report=term-missing"
